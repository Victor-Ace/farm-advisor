name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip buildozer "cython<3"

       - name: Build the APK with Buildozer
         run: |
          sed -i '/^andriod/d' buildozer.spec
          sed -i '/^android.ndk/d; /^android.archs/d' buildozer.spec
          sed -i '/^android.minapi/a android.ndk = 25b\nandroid.ndk_api = 21\nandroid.archs = arm64-v8a' buildozer.spec
          grep -n "android\." buildozer.spec
          buildozer -v android debug

      - name: Save the APK so it can be downloaded
        uses: actions/upload-artifact@v4
        with:
          name: farm-advisor-apk
          path: bin/*.apk
